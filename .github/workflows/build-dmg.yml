name: Build DMG

# 云打包：产出一个未签名（ad-hoc 签名）的 dmg，供内测分发。
#
# 为什么不能直接 `xcodebuild` 了事：
#   1. CodeEdit.xcodeproj 用 XCLocalSwiftPackageReference 指向 `../CodeEditSourceEditor`，
#      而后者又依赖 `../CodeEditTextView` 与 `../CodeEditLanguages`。
#      因此 CI 必须把四个仓库检出成**同级目录**，否则包解析直接失败。
#   2. 构建阶段关闭代码签名（无证书），产物需 ad-hoc 签名后才能在本机启动，
#      由 scripts/package-dmg.sh 负责，工作流不接触任何证书类 secrets。
#   3. runner 架构不固定，构建目标通过 BUILD_DESTINATION 覆盖为 generic/platform=macOS。
#
# 发布：
#   推 v* 标签时，除上传 workflow artifact 外，还会：
#     1. 把 dmg 作为 OCI 制品推送到 GHCR（ghcr.io/<owner>/qiyide:<tag>），即仓库右侧 Packages；
#     2. 创建 GitHub Release，把 dmg 作为附件上传（Releases 页可直接下载）。
#   macOS runner 没有 Docker，因此 GHCR 用 oras 推送，不经过容器构建。
#   手动运行只产出 artifact，不发布，避免占用版本号。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 CodeEdit 分支或标签"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

permissions:
  # 创建 GitHub Release 并上传附件需要写权限。
  contents: write
  # 推送制品到 GHCR 需要写权限；标签以外的触发不会用到。
  packages: write

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  # 本地包固定到具体提交：三个仓库的改动需要与主仓库精确对应，
  # 用分支名会让同一份 CodeEdit 在不同时间构建出不同结果。
  # 升级本地包后同步更新这里的 SHA。
  CODEEDIT_SOURCE_EDITOR_REF: efb55b4226b621686f7df0e12d5b6d91403efd63
  CODEEDIT_TEXTVIEW_REF: 49fb275c99528f0949f38457532bec630e1c7d1a
  CODEEDIT_LANGUAGES_REF: 32a1ddcb44d0bcf9bdb41ae426fa1bb7198e62fe

jobs:
  build:
    # 需要 macOS 26 SDK 时可把仓库变量 MACOS_RUNNER 设为 macos-26（Settings → Variables）。
    # 未设置时退回 macos-15（Xcode 16，项目部署目标为 macOS 14，可编译）。
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 90

    steps:
      - name: Checkout CodeEdit
        uses: actions/checkout@v4
        with:
          path: CodeEdit
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Checkout CodeEditSourceEditor
        uses: actions/checkout@v4
        with:
          repository: ShadowHunt-yi/CodeEditSourceEditor
          ref: ${{ env.CODEEDIT_SOURCE_EDITOR_REF }}
          path: CodeEditSourceEditor
          fetch-depth: 1

      - name: Checkout CodeEditTextView
        uses: actions/checkout@v4
        with:
          repository: ShadowHunt-yi/CodeEditTextView
          ref: ${{ env.CODEEDIT_TEXTVIEW_REF }}
          path: CodeEditTextView
          fetch-depth: 1

      - name: Checkout CodeEditLanguages
        uses: actions/checkout@v4
        with:
          repository: ShadowHunt-yi/CodeEditLanguages
          ref: ${{ env.CODEEDIT_LANGUAGES_REF }}
          path: CodeEditLanguages
          fetch-depth: 1

      - name: Verify sibling package layout
        working-directory: CodeEdit
        # 本地路径依赖要求三个包与 CodeEdit 处于同一父目录下，缺一个就会解析失败。
        run: |
          set -e
          for pkg in CodeEditSourceEditor CodeEditTextView CodeEditLanguages; do
            test -f "../$pkg/Package.swift" || { echo "缺少同级包: ../$pkg"; exit 1; }
          done
          echo "同级包布局正确"
          ls -1 ..

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Build (Release, unsigned)
        working-directory: CodeEdit
        env:
          BUILD_DESTINATION: generic/platform=macOS
        run: ./scripts/build.sh Release

      - name: Package DMG
        working-directory: CodeEdit
        run: ./scripts/package-dmg.sh Release

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Qiyide-dmg-${{ github.run_number }}
          path: CodeEdit/build/*.dmg
          if-no-files-found: error
          retention-days: 14

      # ── 以下步骤只在推 tag 时执行：把 dmg 发布到 GHCR（仓库右侧 Packages）──

      - name: Install oras
        if: startsWith(github.ref, 'refs/tags/v')
        # macOS runner 没有 Docker，无法用 buildx 打包镜像；
        # oras 可以把任意文件作为 OCI 制品推送，正适合分发 dmg。
        run: |
          set -euo pipefail
          ORAS_VERSION="1.2.2"
          case "$(uname -m)" in
            arm64) ARCH="arm64" ;;
            x86_64) ARCH="amd64" ;;
            *) echo "不支持的架构: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_darwin_${ARCH}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" oras
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/oras" version

      - name: Push DMG to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: CodeEdit/build
        env:
          TAG: ${{ github.ref_name }}
          # 通过环境变量传入：避免 token 出现在命令行参数里（ps 可见）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG="$(ls *.dmg | head -1)"

          # GHCR 镜像名必须全小写（owner 可能是 ShadowHunt-yi）。
          # 注意：不能用 `${VAR,,}`——macOS runner 的 /bin/bash 是 3.2，
          # 不支持大小写展开，会直接报 "bad substitution" 并中止步骤。
          OWNER_LOWER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/qiyide"
          echo "镜像: ${IMAGE}:${TAG}"

          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # org.opencontainers.image.source 决定该包是否关联到本仓库，
          # 缺这一条会出现「Packages 里能看到，但仓库页不显示」。
          oras push "${IMAGE}:${TAG}" \
            --artifact-type "application/vnd.qiyide.dmg.v1" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${TAG}" \
            --annotation "org.opencontainers.image.title=${DMG}" \
            "${DMG}:application/octet-stream"

          oras manifest fetch "${IMAGE}:${TAG}" | head -20
          echo "已发布: ${IMAGE}:${TAG}"
          echo "重新下载: oras pull ${IMAGE}:${TAG}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: CodeEdit
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG_PATH="$(ls build/*.dmg | head -1)"
          DMG_NAME="$(basename "$DMG_PATH")"

          # 发布说明直接取注释标签的正文，避免维护两份变更记录。
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          NOTES="${NOTES}

          ---
          安装：打开 ${DMG_NAME}，把 Qiyide.app 拖入「应用程序」。

          本构建未做 Developer ID 签名与公证，首次启动会被 Gatekeeper 拦截：
          右键 → 打开，或执行
          xattr -dr com.apple.quarantine /Applications/Qiyide.app

          校验：
          $(shasum -a 256 "$DMG_PATH")"

          # 标签重跑时 Release 可能已存在：只替换附件，不重复创建。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，替换附件"
            gh release upload "$TAG" "$DMG_PATH" --clobber
          else
            gh release create "$TAG" "$DMG_PATH" \
              --title "Qiyide ${TAG}" \
              --notes "$NOTES" \
              --verify-tag
          fi

          gh release view "$TAG" --json url,tagName,assets \
            --jq '"Release: \(.url)", (.assets[] | "附件: \(.name)  \(.size) 字节")'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: CodeEdit/build/build.log
          if-no-files-found: ignore
          retention-days: 7
